name: refresh
on:
  schedule:
    - cron: '5 7-21 * * *'
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # GitHub's starter workflow ships `false`, on the assumption that deploys are
  # rare, manual and precious. These run 15 times a day and are disposable, so
  # queueing behind a wedged predecessor is strictly worse than replacing it.
  # A stuck Pages deployment on 2026-08-11 held the queue for 13 hours; with
  # this the next hourly run clears it and the site is at most one hour stale.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -e .
      - run: python -m cinepipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          BASELINE_URL: ${{ vars.BASELINE_URL }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Backstop: a wedged Pages deployment otherwise queues indefinitely with no
    # steps and no failure, which looks exactly like "the cron stopped working".
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
