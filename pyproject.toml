[project]
name = "cinepipeline"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "python-dotenv>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["contract: hits live sources; excluded from the default run"]
addopts = "-m 'not contract'"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Blind `except Exception` is deliberate: a failing adapter or enrichment must
# never abort the run (adapter isolation / graceful degradation by design).
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct naive datetimes to check they are rejected.
"tests/**" = ["DTZ001"]
