[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinepipeline"
version = "0.1.0"
description = "Paris cinema showtimes data pipeline"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "selectolax>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.setuptools.packages.find]
include = ["cinepipeline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
